[workspace]
resolver = "2"
members = [
    "crates/chm-core",
    "crates/chm-cloud-api",
    "crates/chm-clickhouse",
    "crates/chm-postgres",
    "crates/chm-update",
    "crates/chm-telemetry",
    "app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# internal
chm-core = { path = "crates/chm-core" }
chm-cloud-api = { path = "crates/chm-cloud-api" }
chm-clickhouse = { path = "crates/chm-clickhouse" }
chm-postgres = { path = "crates/chm-postgres" }
chm-update = { path = "crates/chm-update" }
chm-telemetry = { path = "crates/chm-telemetry" }

# gpui-component stack — official Zed GPUI + Longbridge widgets.
# runtime_shaders compiles Metal shaders at launch so `cargo build` works on a
# Mac that only has Command Line Tools (no Xcode `metal` compiler). Prefer the
# precompiled path when Xcode is installed — drop this feature then.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "runtime_shaders"] }
gpui-base = { git = "https://github.com/longbridge/gpui-component" }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }

# crates-io
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.beta]
inherits = "release"
debug = false

[profile.smoke]
inherits = "dev"
opt-level = 1
